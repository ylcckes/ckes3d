  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Noto Sans TC', 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    #labels-container { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
    .poi-label {
      position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
      white-space: nowrap; padding: 3px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.42);
      border: 1.5px solid rgba(255,255,255,0.85); transition: transform 0.15s ease, box-shadow 0.15s ease; backdrop-filter: blur(4px);
    }
    .poi-label:hover { transform: translate(-50%, -108%) scale(1.12); z-index: 50 !important; }
    .poi-label.active-poi { transform: translate(-50%, -112%) scale(1.16); z-index: 60 !important; outline: 2.5px solid #facc15; box-shadow: 0 0 18px rgba(250,204,21,0.85); }
    .poi-label::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-width: 5px 4px 0 4px; border-style: solid; border-color: rgba(255,255,255,0.9) transparent transparent transparent; }
    .badge-1f { background: rgba(71,85,105,0.94); color: #fff; }
    .badge-2f { background: rgba(190,24,93,0.92); color: #fff; }
    .badge-sport { background: rgba(234,88,12,0.92); color: #fff; }
    .badge-eco { background: rgba(5,150,105,0.92); color: #fff; }
    .badge-gate { background: rgba(37,99,235,0.92); color: #fff; }
    .badge-util { background: rgba(51,65,85,0.92); color: #f1f5f9; font-size: 10px; padding: 2px 6px; }
    .road-label { position: absolute; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: rgba(15,23,42,0.78); color: #e2e8f0; border: 1px dashed rgba(148,163,184,0.6); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15,23,42,0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.45); border-radius: 9999px; }
    .glass-panel { background: rgba(15,23,42,0.84); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.14); }

    function computeGroundAndStairElevation(cx, cz) {
      if (cx >= 41.6 && cx <= 46.8 && cz >= -26.0 && cz <= -17.0) {
        if (cz <= -22.8) { character.targetFloor = 1.5; updateCharacterFloorBadge(); return 2.38; }
        if (cx < 44.2) { const r1 = Math.max(0, Math.min(1, (-17.2 - cz) / 5.6)); character.targetFloor = r1 > 0.35 ? 1.5 : 1; updateCharacterFloorBadge(); return 0.28 + r1 * 2.10; }

      }
      if (cx >= 24.8 && cx <= 33.8 && cz >= -12.5 && cz <= -5.3) {
        if (cx >= 30.6) { character.targetFloor = 1.5; updateCharacterFloorBadge(); return 2.38; }
        if (cz >= -8.9) { const r1 = Math.max(0, Math.min(1, (cx - 25.0) / 5.6)); character.targetFloor = r1 > 0.35 ? 1.5 : 1; updateCharacterFloorBadge(); return 0.28 + r1 * 2.10; }
        const r2 = Math.max(0, Math.min(1, (30.6 - cx) / 5.6)); character.targetFloor = r2 > 0.72 ? 2 : 1.5; updateCharacterFloorBadge(); return 2.38 + r2 * 2.10;
      }
      if (character.targetFloor === 2) return 4.48;
      if ((cx >= -15.2 && cx <= 93.2 && cz >= -18.0 && cz <= -13.3) || (cx >= 38.2 && cx <= 41.6 && cz >= -32.3 && cz <= -13.3) || (cx >= 20.6 && cx <= 25.4 && cz >= -13.8 && cz <= 36.0)) {

    function applyCorridorWallCollision(nx, nz, radius = 0.45) {

      if (!state.isDriving && ox >= 41.65 && ox <= 46.7 && oz < -17.05 && oz >= -25.9) {
        nx = Math.max(41.75, Math.min(46.65, nx)); nz = Math.max(-25.8, nz);
        if (nz > -22.7 && oz > -22.7) nx = ox < 44.2 ? Math.min(44.05, nx) : Math.max(44.35, nx);
        return [nx, nz];
      }
      if (!state.isDriving && ox > 24.85 && ox <= 33.7 && oz >= -12.45 && oz <= -5.35) {

        return [ox, oz];
      }
      if (!isCollidingWith1FBuildings(nx, nz, radius)) return [nx, nz];
      if (!isCollidingWith1FBuildings(nx, oz, radius)) return [nx, oz];

    function updateOrbitCamera() {
      orbit.spherical.phi = Math.max(0.18, Math.min(Math.PI / 2 - 0.03, orbit.spherical.phi));
      orbit.spherical.radius = Math.max(6, Math.min(240, orbit.spherical.radius));
      camera.position.copy(orbit.target).add(new THREE.Vector3().setFromSpherical(orbit.spherical));
      camera.lookAt(orbit.target);
    }

    function flyCameraTo(tx, ty, tz, offsetArr = [0, 14, 22]) {
      const startTarget = orbit.target.clone(), endTarget = new THREE.Vector3(tx, ty, tz);
      const endSpherical = new THREE.Spherical().setFromVector3(new THREE.Vector3(tx + offsetArr[0], ty + offsetArr[1], tz + offsetArr[2]).sub(endTarget));
      orbit.flyAnim = { startTime: performance.now(), duration: 650, startTarget, endTarget, startR: orbit.spherical.radius, endR: endSpherical.radius, startPhi: orbit.spherical.phi, endPhi: endSpherical.phi, startTheta: orbit.spherical.theta, endTheta: endSpherical.theta };
    }

      if (orbit.isDragging) { orbit.spherical.theta -= dx * 0.0065; orbit.spherical.phi -= dy * 0.0055; updateOrbitCamera(); }

      else if (character.targetFloor === 2) { el.textContent = '位置：2F 二樓走廊'; el.className = 'px-2 py-0.5 rounded bg-pink-500/30 text-pink-200 font-bold'; }
      else if (character.targetFloor === 1.5) { el.textContent = '位置：0.5F 樓梯平台'; el.className = 'px-2 py-0.5 rounded bg-indigo-500/30 text-indigo-200 font-bold'; }
      else { el.textContent = '位置：1F 走廊/戶外'; el.className = 'px-2 py-0.5 rounded bg-slate-700 text-amber-300 font-bold'; }
    }

    function setNavigationMode(mode) {
      state.mode = mode;
      const orbitBtn = document.getElementById('mode-orbit-btn'), walkBtn = document.getElementById('mode-walk-btn');
      const povBtn = document.getElementById('btn-walk-pov'), walkHud = document.getElementById('walk-hud');
      if (mode === 'walk') {
        walkBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow';
        orbitBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-300 hover:text-white';
        povBtn.classList.remove('hidden'); walkHud.classList.remove('hidden');
      } else {
        if (state.isDriving) toggleCarDriving();
        orbitBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow';
        walkBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-300 hover:text-white';
        povBtn.classList.add('hidden'); walkHud.classList.add('hidden');
        orbit.target.set(character.x, character.y + 1.8, character.z); updateOrbitCamera();
      }
    }

    const minimapCanvas = document.getElementById('minimap-canvas'), mCtx = minimapCanvas.getContext('2d');
    function worldToMinimap(wx, wz) { return [((wx + 115) / 230) * minimapCanvas.width, ((wz + 75) / 150) * minimapCanvas.height]; }
    function minimapToWorld(mx, mz) { return [(mx / minimapCanvas.width) * 230 - 115, (mz / minimapCanvas.height) * 150 - 75]; }

    function drawMinimap() {
      if (state.minimapCollapsed) return;
      const w = minimapCanvas.width, h = minimapCanvas.height;
      mCtx.clearRect(0, 0, w, h); mCtx.fillStyle = '#f8fafc'; mCtx.fillRect(0, 0, w, h);
      mCtx.strokeStyle = '#334155'; mCtx.lineWidth = 2; mCtx.strokeRect(6, 6, w - 12, h - 18);

      const drawRectWorld = (x, z, rw, rd, fill, stroke, text = '') => {
        const [x1, z1] = worldToMinimap(x - rw / 2, z - rd / 2), [x2, z2] = worldToMinimap(x + rw / 2, z + rd / 2);
        mCtx.fillStyle = fill; mCtx.fillRect(x1, z1, x2 - x1, z2 - z1);
        mCtx.strokeStyle = stroke; mCtx.lineWidth = 1; mCtx.strokeRect(x1, z1, x2 - x1, z2 - z1);
        if (text) { mCtx.fillStyle = '#0f172a'; mCtx.font = 'bold 8px "Noto Sans TC", sans-serif'; mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle'; mCtx.fillText(text, (x1 + x2) / 2, (z1 + z2) / 2); }
      };

      const [tx, tz] = worldToMinimap(-53.5, 16.0);
      mCtx.fillStyle = '#ea580c'; mCtx.beginPath(); mCtx.ellipse(tx, tz, 28, 16, 0, 0, Math.PI * 2); mCtx.fill();
      mCtx.fillStyle = '#84cc16'; mCtx.beginPath(); mCtx.ellipse(tx, tz, 19, 10, 0, 0, Math.PI * 2); mCtx.fill();
      drawRectWorld(-90.5, 27.5, 16, 27, '#6ee7b7', '#047857', '4籃球');
      drawRectWorld(-89.2, 7.4, 14.8, 12.8, '#f472b6', '#be185d', '遊戲區');
      drawRectWorld(-76.5, -5.0, 6.2, 11, '#bae6fd', '#0284c7', '3廁');
      drawRectWorld(-53.5, -2.2, 7.6, 5.8, '#fed7aa', '#c2410c', '2司令台');
      drawRectWorld(-35.5, -12.5, 11.6, 26, '#cbd5e1', '#475569', '1思源堂');
      drawRectWorld(-25.8, -12.5, 7.2, 26, '#fed7aa', '#c2410c', '廚房');
      drawRectWorld(-25.8, -29.5, 7.6, 5.2, '#bbf7d0', '#15803d', '機車');
      drawRectWorld(-2, -53, 21, 11, '#cbd5e1', '#1e293b', '車庫(黑車)');
      drawRectWorld(28, -53, 24, 13, '#cbd5e1', '#475569', '宿舍');
      drawRectWorld(68, -54, 32, 20, '#bbf7d0', '#15803d', '晴天球場');
      drawRectWorld(2.4, 11.1, 22.4, 47.8, '#dcfce7', '#15803d', '中庭/生態池');
      drawRectWorld(6, 55, 17, 12, '#e2e8f0', '#475569', '蝴蝶館');
      drawRectWorld(26, 55, 17, 12, '#e2e8f0', '#475569', '採風館');
      drawRectWorld(39, -23.5, 108, 19, '#94a3b8', '#334155', '教學大樓');
      drawRectWorld(31, 11, 20, 49, '#94a3b8', '#334155', '辦公樓');

      const px = state.isDriving ? drivableCar.x : character.x, pz = state.isDriving ? drivableCar.z : character.z, pr = state.isDriving ? drivableCar.rotY : character.rotY;
      const [cx, cz] = worldToMinimap(px, pz);
      mCtx.save(); mCtx.translate(cx, cz); mCtx.rotate(-pr + Math.PI);
      mCtx.fillStyle = state.isDriving ? '#111827' : '#a855f7';
      mCtx.beginPath(); mCtx.moveTo(0, -6); mCtx.lineTo(4.5, 5); mCtx.lineTo(-4.5, 5); mCtx.closePath(); mCtx.fill();
      mCtx.restore();
    }

    minimapCanvas.addEventListener('click', e => {
      const rect = minimapCanvas.getBoundingClientRect();
      const [wx, wz] = minimapToWorld(((e.clientX - rect.left) / rect.width) * minimapCanvas.width, ((e.clientY - rect.top) / rect.height) * minimapCanvas.height);
      let nearest = null, bestDist = Infinity;
      CAMPUS_POIS.forEach(poi => {
        const d2 = (poi.x - wx) ** 2 + (poi.z - wz) ** 2;
        if (d2 < bestDist) { bestDist = d2; nearest = poi; }
      });
      if (nearest) selectPoi(nearest.id, false);
    });

    document.getElementById('mode-orbit-btn').addEventListener('click', () => setNavigationMode('orbit'));
    document.getElementById('mode-walk-btn').addEventListener('click', () => setNavigationMode('walk'));
    document.getElementById('btn-walk-pov').addEventListener('click', e => {
      state.walkPov = state.walkPov === 'third' ? 'first' : 'third';
      e.currentTarget.textContent = state.walkPov === 'third' ? '視角：第三人稱' : '視角：第一人稱';
    });

    function syncLabelButtonsUI() {
      const subBtn = document.getElementById('btn-toggle-sublabels'), hideBtn = document.getElementById('btn-hide-all-labels');
      if (state.hideAllLabels) {
        subBtn.textContent = '🏷️ 標籤：已全關'; hideBtn.textContent = '👁️ 顯示文字標籤';
      } else {
        subBtn.textContent = state.showSubLabels ? '🏷️ 全部標籤：開' : '🏷️ 僅主教室標籤'; hideBtn.textContent = '🚫 關閉所有標籤';
      }
    }
    document.getElementById('btn-toggle-sublabels').addEventListener('click', () => {
      if (state.hideAllLabels) { state.hideAllLabels = false; state.showSubLabels = true; }
      else if (state.showSubLabels) state.showSubLabels = false;
      else state.hideAllLabels = true;
      syncLabelButtonsUI();
    });
    document.getElementById('btn-hide-all-labels').addEventListener('click', () => { state.hideAllLabels = !state.hideAllLabels; syncLabelButtonsUI(); });

    document.getElementById('btn-time-of-day').addEventListener('click', e => {
      if (state.timeOfDay === 'day') {
        state.timeOfDay = 'sunset'; scene.background.setHex(0xfed7aa); scene.fog.color.setHex(0xfed7aa);
        sunLight.color.setHex(0xfb923c); e.currentTarget.textContent = '🌅 溫暖夕陽';
      } else if (state.timeOfDay === 'sunset') {
        state.timeOfDay = 'night'; scene.background.setHex(0x0f172a); scene.fog.color.setHex(0x0f172a);
        sunLight.color.setHex(0x93c5fd); sunLight.intensity = 0.45; e.currentTarget.textContent = '🌙 靜謐星夜';
      } else {
        state.timeOfDay = 'day'; scene.background.setHex(0xbae6fd); scene.fog.color.setHex(0xbae6fd);
        sunLight.color.setHex(0xfffbeb); sunLight.intensity = 1.05; e.currentTarget.textContent = '☀️ 晴朗日間';
      }
    });

    document.getElementById('btn-reset-camera').addEventListener('click', () => { setNavigationMode('orbit'); flyCameraTo(0, 2, 10, [-22, 34, 58]); });
    document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
      state.sidebarOpen = !state.sidebarOpen;
      document.getElementById('sidebar-panel').style.transform = state.sidebarOpen ? 'translateX(0)' : 'translateX(-110%)';
    });

    document.querySelectorAll('.cat-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.categoryFilter = btn.dataset.cat;
        document.querySelectorAll('.cat-tab').forEach(b => { b.classList.toggle('ring-2', b === btn); b.classList.toggle('ring-yellow-400', b === btn); });
        renderSidebarList();
      });
    });

    const searchInput = document.getElementById('search-input'), clearSearchBtn = document.getElementById('btn-clear-search');
    searchInput.addEventListener('input', e => { state.searchQuery = e.target.value; clearSearchBtn.classList.toggle('hidden', !state.searchQuery); renderSidebarList(); });
    clearSearchBtn.addEventListener('click', () => { searchInput.value = ''; state.searchQuery = ''; clearSearchBtn.classList.add('hidden'); renderSidebarList(); });

    document.getElementById('btn-teleport-here').addEventListener('click', () => selectPoi(state.selectedPoiId, true));
    document.getElementById('btn-go-pond').addEventListener('click', () => selectPoi('eco-pond', true));
    document.getElementById('btn-go-sunny').addEventListener('click', () => selectPoi('sp-sunnycourt', false));
    document.getElementById('btn-go-car').addEventListener('click', () => selectPoi('gt-car-north', true));
    document.getElementById('btn-minimap-floor').addEventListener('click', e => {
      state.minimapFloor = state.minimapFloor === 1 ? 2 : 1;
      e.currentTarget.textContent = `平面：${state.minimapFloor}F`;
    });
    document.getElementById('btn-toggle-minimap').addEventListener('click', e => {
      state.minimapCollapsed = !state.minimapCollapsed;
      document.getElementById('minimap-body').classList.toggle('hidden', state.minimapCollapsed);
      e.currentTarget.textContent = state.minimapCollapsed ? '展開' : '—';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let prevTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - prevTime) / 1000, 0.1);
      prevTime = now;

      butterflies.forEach(b => {
        const t = now * 0.001 * b.speed + b.phase;
        b.group.position.set(b.baseX + Math.cos(t) * b.radius, b.baseY + Math.sin(t * 2.5) * 0.45, b.baseZ + Math.sin(t * 1.3) * b.radius);
        b.group.rotation.y = -t + Math.PI / 2;
        const flap = Math.sin(now * 0.018 + b.phase) * 0.65;
        b.leftWing.rotation.y = flap; b.rightWing.rotation.y = -flap;
      });

      tasselRows.forEach(tr => {
        const sway = Math.sin(now * 0.003 + tr.phase) * 0.14;
        if (tr.axis === 'x') tr.mesh.rotation.x = sway;
        else tr.mesh.rotation.z = sway;
      });

      const carBanner = document.getElementById('car-prompt-banner');
      const distToCar = Math.hypot(character.x - drivableCar.x, character.z - drivableCar.z);
      if (state.isDriving) {
        carBanner.classList.remove('hidden');
        document.getElementById('car-prompt-text').textContent = '🚗 正在駕駛四輪黑色轎車（WASD 行駛、F 下車）';
        document.getElementById('btn-toggle-drive').textContent = '🚪 下車步行 (F)';
      } else if (distToCar <= 9.5 && character.targetFloor === 1) {
        carBanner.classList.remove('hidden');
        document.getElementById('car-prompt-text').textContent = '🚗 靠近北側車庫四輪黑色轎車';
        document.getElementById('btn-toggle-drive').textContent = '🔑 上車駕駛 (F)';
      } else carBanner.classList.add('hidden');

      if (state.mode === 'orbit') {
        if (orbit.flyAnim) {
          const p = Math.min(1, (now - orbit.flyAnim.startTime) / orbit.flyAnim.duration), ease = 1 - Math.pow(1 - p, 3);
          orbit.target.lerpVectors(orbit.flyAnim.startTarget, orbit.flyAnim.endTarget, ease);
          orbit.spherical.radius = orbit.flyAnim.startR + (orbit.flyAnim.endR - orbit.flyAnim.startR) * ease;
          orbit.spherical.phi = orbit.flyAnim.startPhi + (orbit.flyAnim.endPhi - orbit.flyAnim.startPhi) * ease;
          orbit.spherical.theta = orbit.flyAnim.startTheta + (orbit.flyAnim.endTheta - orbit.flyAnim.startTheta) * ease;
          updateOrbitCamera();
          if (p >= 1) orbit.flyAnim = null;
        }
      }

      if (state.mode === 'walk') {
        if (state.isDriving) {
          const carMoveSpeed = (state.sprint ? 32 : 20) * dt;
          const turnRate = 1.9 * dt;
          let driveDir = 0;
          if (keys.w) driveDir += 1;
          if (keys.s) driveDir -= 1;
          if (keys.q || keys.a) drivableCar.rotY += turnRate * (driveDir >= 0 ? 1 : -1);
          if (keys.e || keys.d) drivableCar.rotY -= turnRate * (driveDir >= 0 ? 1 : -1);

          if (driveDir !== 0) {
            const nx = Math.max(-108, Math.min(108, drivableCar.x - Math.sin(drivableCar.rotY) * driveDir * carMoveSpeed));
            const nz = Math.max(-68, Math.min(75, drivableCar.z - Math.cos(drivableCar.rotY) * driveDir * carMoveSpeed));
            [drivableCar.x, drivableCar.z] = applyCorridorWallCollision(nx, nz, 1.35);
            drivableCar.wheels.forEach(w => { w.rotation.x -= driveDir * carMoveSpeed * 1.6; });
          }
          drivableCar.group.position.set(drivableCar.x, drivableCar.y, drivableCar.z);
          drivableCar.group.rotation.y = drivableCar.rotY;
          character.x = drivableCar.x; character.z = drivableCar.z; character.rotY = drivableCar.rotY;

          const desiredCamX = drivableCar.x + Math.sin(drivableCar.rotY) * 11.0;
          const desiredCamZ = drivableCar.z + Math.cos(drivableCar.rotY) * 11.0;
          camera.position.lerp(new THREE.Vector3(desiredCamX, drivableCar.y + 4.2, desiredCamZ), 0.22);
          camera.lookAt(drivableCar.x, drivableCar.y + 1.2, drivableCar.z);
        } else {
          const moveSpeed = (state.sprint ? 21 : 11.5) * dt, turnSpeed = 2.1 * dt;
          if (keys.q) character.rotY += turnSpeed;
          if (keys.e) character.rotY -= turnSpeed;
          let forwardInput = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
          let strafeInput = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);

          if (forwardInput !== 0 || strafeInput !== 0) {
            const fx = -Math.sin(character.rotY), fz = -Math.cos(character.rotY);
            const rx = Math.cos(character.rotY), rz = -Math.sin(character.rotY);
            let nx = Math.max(-108, Math.min(108, character.x + (fx * forwardInput + rx * strafeInput) * moveSpeed));
            let nz = Math.max(-68, Math.min(72, character.z + (fz * forwardInput + rz * strafeInput) * moveSpeed));
            [character.x, character.z] = applyCorridorWallCollision(nx, nz, 0.45);
            character.walkCycle += dt * (state.sprint ? 15 : 9);
            const swing = Math.sin(character.walkCycle) * 0.55;
            charLeftLeg.rotation.x = swing; charRightLeg.rotation.x = -swing;
            charLeftArm.rotation.x = -swing * 0.8; charRightArm.rotation.x = swing * 0.8;
          } else {
            charLeftLeg.rotation.x *= 0.85; charRightLeg.rotation.x *= 0.85;
            charLeftArm.rotation.x *= 0.85; charRightArm.rotation.x *= 0.85;
          }

          const groundY = computeGroundAndStairElevation(character.x, character.z);
          if (!character.onGround) {
            character.vy -= 19.6 * dt; character.y += character.vy * dt;
            if (character.y <= groundY) { character.y = groundY; character.vy = 0; character.onGround = true; }
          } else character.y += (groundY - character.y) * 0.35;

          character.group.position.set(character.x, character.y, character.z);
          character.group.rotation.y = character.rotY;

          if (state.walkPov === 'third') {
            character.group.visible = true;
            camera.position.lerp(new THREE.Vector3(character.x + Math.sin(character.rotY) * 7.2, character.y + 2.85, character.z + Math.cos(character.rotY) * 7.2), 0.22);
            camera.lookAt(character.x, character.y + 1.85, character.z);
          } else {
            character.group.visible = false;
            camera.position.set(character.x, character.y + 2.15, character.z);
            camera.lookAt(character.x - Math.sin(character.rotY) * 12, character.y + 2.08, character.z - Math.cos(character.rotY) * 12);
          }
        }
      } else character.group.visible = !state.isDriving;

      if (charRing) { const s = 1 + Math.sin(now * 0.005) * 0.12; charRing.scale.set(s, s, 1); }
      update3DLabelsProjection();
      drawMinimap();
      renderer.render(scene, camera);
    }

    window.addEventListener('load', () => {
      buildCampusScene();
      buildCharacterAvatar();
      init3DLabels();
      renderSidebarList();
      updateOrbitCamera();
      if (!state.sidebarOpen) document.getElementById('sidebar-panel').style.transform = 'translateX(-110%)';
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
